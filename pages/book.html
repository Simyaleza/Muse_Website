  <body>
    <!-- Navigation bar -->

      <button><a href="book.html">Book now</a></button>

    <!-- Booking form section -->
    <main class="booking">
      <h1>Booking Form</h1>
      <h3>Reserve your table by filling out the form below!</h3>

      <!-- Booking form -->
      <form action="#" method="post">
        <div class="form">
          <div class="customer-details">
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Name"
              required
            />
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Email"
              required
            />
          </div>
        </div>
        <div class="location">
          <select id="country" name="country">
            <option value="">Select table</option>
            <option value="south-africa">for 2 people</option>
            <option value="nigeria">for 4 people</option>
            <option value="kenya">for 6 people</option>
          </select>
          <div class="date-booking">
            <label for="booking-date">Date of Booking:</label>
            <input type="date" id="booking-date" name="booking-date" />
          </div>
          <div class="time-booking">
            <label for="booking-time">Time of Booking:</label>
            <input type="time" id="booking-time" name="booking-time" />
          </div>
          <textarea name="booking-msg" id="msg" placeholder="Any special requests or notes?"></textarea>
          <br>
          <button type="submit">Submit</button>
        </div>
      </form>
    </main>

        <!-- Footer section -->
